<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; connect-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Learn Shamir secret sharing with finite fields, interpolation and implementation pitfalls.">
  <title>ShamirSharing CipherLab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="sha256-core.js" defer></script>
  <script src="gf-core.js" defer></script>
  <script src="pitfalls.js" defer></script>
  <script src="messages.js" defer></script>
  <script src="app.js" defer></script>
  <script src="intro.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div class="masthead"><div><h1>ShamirSharing <span>CipherLab</span></h1></div>
      <div class="header-tools"><button id="theme" class="icon-button" type="button" data-label="theme">◐</button>
        <button id="language" class="icon-button" type="button" data-label="language">EN</button>
        <button id="help" class="icon-button" type="button" data-label="help" aria-haspopup="dialog">?</button></div></div>
    <p class="subtitle" data-i18n="subtitle"></p>
    <p class="tagline" data-i18n="tagline"></p>
  </header>
  <main>
    <div class="tabs" role="tablist" aria-label="Learning steps" data-label="tablist">
      <button id="tab-linear" role="tab" type="button" aria-controls="panel-linear" aria-selected="true" tabindex="0" data-i18n="linear"></button>
      <button id="tab-hand" role="tab" type="button" aria-controls="panel-hand" aria-selected="false" tabindex="-1" data-i18n="hand"></button>
      <button id="tab-bytes" role="tab" type="button" aria-controls="panel-bytes" aria-selected="false" tabindex="-1" data-i18n="bytes"></button>
      <button id="tab-pitfalls" role="tab" type="button" aria-controls="panel-pitfalls" aria-selected="false" tabindex="-1" data-i18n="pitfalls"></button>
    </div>
    <section id="panel-linear" class="panel" role="tabpanel" aria-labelledby="tab-linear">
      <h2 data-i18n="linear"></h2>
      <h3 data-i18n="linearDistributionTitle"></h3>
      <p data-i18n="linearIntro"></p>
      <section class="field-primer" aria-labelledby="gf13-title">
        <h4 id="gf13-title" data-i18n="gf13Title"></h4>
        <p data-i18n="gf13Definition"></p>
        <h4 data-i18n="gf13ExamplesTitle"></h4>
        <ul><li data-i18n="gf13Addition"></li><li data-i18n="gf13Multiplication"></li><li data-i18n="gf13Division"></li></ul>
        <h4 data-i18n="gf13WhyPrimeTitle"></h4>
        <p data-i18n="gf13PrimeReason"></p><p data-i18n="gf13Composite"></p>
        <h4 data-i18n="gf13RoleTitle"></h4>
        <p data-i18n="gf13Shares"></p><p data-i18n="gf13IntegerLeak"></p>
      </section>
      <p class="linear-formula"><span data-i18n="linearFieldSetup"></span><br><strong>f(x) = s + a₁x (mod 13)</strong><span data-i18n="linearFormulaEnd"></span></p>
      <p data-i18n="linearField"></p>
      <div class="settings-grid"><label><span>n</span><select id="linear-n"></select></label></div>
      <p id="linear-threshold" role="status"></p>
      <p data-i18n="linearDistributionIntro"></p>
      <details id="linear-dealer"><summary data-i18n="linearDealer"></summary><p data-i18n="linearDealerSet"></p><p data-i18n="linearDealerHelp"></p>
        <div class="settings-grid"><label><span>s = f(0)</span><input id="linear-secret" type="number" min="0" max="12" value="5" inputmode="numeric"></label>
          <label><span>a₁</span><input id="linear-slope" type="number" min="0" max="12" value="4" inputmode="numeric"></label></div>
        <button id="linear-reset" type="button" data-i18n="reset"></button><p id="linear-status" role="status"></p>
        <p data-i18n="linearDistributionHelp"></p><div id="linear-distribution" class="share-data"></div>
      </details>
      <h3 data-i18n="linearRecoveryTitle"></h3><p data-i18n="linearRecoveryIntro"></p>
      <h4 class="linear-step-heading" data-i18n="linearShares"></h4><p data-i18n="linearShareHint"></p>
      <p data-i18n="linearPairMeaning"></p><div id="linear-picks" class="actions"></div>
      <p id="linear-selected" class="result" role="status"></p>
      <h4 class="linear-step-heading" data-i18n="linearGridTitle"></h4><p data-i18n="linearGridIntro"></p>
      <div id="linear-one"><p id="linear-one-result"></p>
        <h5 data-i18n="linearAnalogyTitle"></h5><p id="linear-analogy-caption"></p>
        <svg id="linear-analogy" viewBox="0 0 300 292" role="img" data-label="linearAnalogyLabel"></svg>
        <p id="linear-distinct" class="demo-step"></p>
        <p data-i18n="linearCandidateHow"></p><div class="actions linear-candidate-controls"><button id="linear-previous" type="button" data-i18n="previous"></button>
        <button id="linear-next" type="button" data-i18n="next"></button>
        <label class="linear-candidate-label"><span data-i18n="linearCandidateLabel"></span><select id="linear-candidate"></select></label></div><p id="linear-candidate-result" class="result"></p></div>
      <div id="linear-two" hidden><p id="linear-two-result" class="result"></p></div>
      <p data-i18n="linearGridHelp"></p><p data-i18n="linearGridPoints"></p>
      <div class="grid-frame"><svg id="linear-grid" width="260" height="260" viewBox="0 0 260 260" role="img" data-label="linearGridLabel"></svg></div>
      <button id="linear-to-hand" type="button" data-i18n="linearToHand"></button>
    </section>
    <section id="panel-hand" class="panel" role="tabpanel" aria-labelledby="tab-hand" hidden>
      <h2 data-i18n="hand"></h2><p data-i18n="handIntro"></p>
      <div class="hand-primer">
        <p data-i18n="handParameters"></p>
        <p data-i18n="thresholdCondition1"></p>
        <p data-i18n="thresholdCondition2"></p>
        <p data-i18n="handDegree"></p>
        <p data-i18n="handPolynomial"></p>
        <p class="hand-formula">f(x) = s + a₁x + a₂x² (mod p)</p>
        <p data-i18n="handInterpolation"></p>
      </div>
      <div class="settings-grid">
        <label><span>p</span><select id="prime"><option>7</option><option>11</option><option selected>13</option><option>17</option><option>19</option><option>23</option></select></label>
        <label><span>k</span><select id="threshold"></select></label>
        <label><span>n</span><select id="share-count"></select></label>
        <label><span>s = f(0)</span><input id="secret" type="number" min="0" value="5" inputmode="numeric"></label>
      </div>
      <div id="coefficient-inputs" class="settings-grid"></div>
      <div class="actions"><button id="random-coefficients" type="button" data-i18n="randomCoefficients"></button><button id="reset-hand" type="button" data-i18n="reset"></button></div>
      <p id="hand-status" role="status"></p>
      <h3 data-i18n="distribute"></h3><p id="polynomial"></p>
      <div class="table-frame"><table><thead><tr><th>x</th><th data-i18n="termValues"></th><th data-i18n="sum"></th><th>mod p</th></tr></thead><tbody id="distribution-table"></tbody></table></div>
      <div id="share-data" class="share-data"></div>
      <h3 data-i18n="reconstruct"></h3><p data-i18n="chooseShares"></p><p id="share-notation" data-i18n="shareNotation"></p><div id="share-picks" class="actions"></div>
      <div class="actions"><button id="select-k" type="button" data-i18n="selectK"></button><button id="select-kminus" type="button" data-i18n="selectKMinus"></button></div>
      <div id="reconstruction-section"><div class="table-frame"><table><thead><tr><th>xᵢ</th><th>yᵢ</th><th>Πxⱼ</th><th>Π(xⱼ−xᵢ)</th><th data-i18n="inverse"></th><th>λᵢ(0)</th><th>λᵢ(0)yᵢ</th></tr></thead><tbody id="reconstruction-table"></tbody></table></div><p id="reconstruction-result" class="result"></p></div>
      <div id="candidate-section" hidden><h3 data-i18n="candidateTitle"></h3><p id="candidate-result"></p>
        <div class="actions"><button id="previous-candidate" type="button" data-i18n="previous"></button><button id="next-candidate" type="button" data-i18n="next"></button>
          <button id="all-candidates" type="button" aria-pressed="false" data-i18n="showAll"></button></div>
        <label class="check"><input id="leading-only" type="checkbox"><span data-i18n="leadingOnly"></span></label>
      </div>
      <h3 data-i18n="gridTitle"></h3><p data-i18n="gridHint"></p><p data-i18n="gridInteractionHint"></p><p id="grid-range" class="muted"></p><div id="grid-frame" class="grid-frame"><svg id="field-grid" role="group" data-label="gridLabel"></svg></div>
      <p id="tweak-result" class="result"></p>
      <h3 data-i18n="realTitle"></h3><p data-i18n="realWarning"></p><div class="grid-frame"><svg id="real-graph" role="img" data-label="realLabel" viewBox="0 0 600 300"></svg></div>
      <p id="real-result" class="result"></p><div id="real-picks" class="actions"></div>
      <h3 data-i18n="integerTitle"></h3><p data-i18n="integerIntro"></p><div class="table-frame"><table><thead><tr><th>x</th><th>f(x) ℤ</th><th>f(x) mod x</th></tr></thead><tbody id="integer-table"></tbody></table></div><p id="integer-result"></p>
    </section>
    <section id="panel-bytes" class="panel" role="tabpanel" aria-labelledby="tab-bytes" hidden>
      <h2 data-i18n="bytes"></h2><p data-i18n="bytesIntro"></p><p data-i18n="byteFieldBridge"></p><p data-i18n="byteMethod"></p>
      <p data-i18n="fieldRule"></p>
      <div class="settings-grid"><label><span data-i18n="byteInput"></span><input id="byte-message" type="text" value="MEET AT DAWN" autocomplete="off" spellcheck="false"></label>
        <label><span>k</span><select id="byte-k"></select></label><label><span>n</span><select id="byte-n"></select></label></div>
      <p id="byte-error" role="status"></p>
      <h3 data-i18n="byteDistribute"></h3><p data-i18n="byteTableHelp"></p><p id="byte-secret-hex" class="result"></p><div id="byte-table-frame" class="table-frame"><table id="byte-table"></table></div>
      <h3 data-i18n="byteRestore"></h3><p data-i18n="byteRestoreHelp"></p><div id="byte-picks" class="actions"></div><div id="byte-weights" class="table-frame"></div>
      <p id="byte-restored-hex" class="result"></p><p id="byte-restored-text" class="result"></p><p data-i18n="byteOutputHelp"></p>
      <h3 data-i18n="multiplication"></h3><p data-i18n="multiplyIntro"></p><div id="multiply-steps" class="table-frame"></div>
      <p id="multiply-log"></p>
    </section>
    <section id="panel-pitfalls" class="panel" role="tabpanel" aria-labelledby="tab-pitfalls" hidden>
      <h2 data-i18n="pitfalls"></h2><p data-i18n="pitfallsIntro"></p><p data-i18n="demoOnly"></p>
      <div class="pitfall-card"><h3 data-i18n="tamperTitle"></h3><label><span data-i18n="checkLayer"></span><select id="tamper-layer"><option value="none" data-i18n="noCheck"></option><option value="crc" data-i18n="crcCheck"></option><option value="fingerprint" data-i18n="fingerprintCheck"></option></select></label><div id="tamper-output"></div></div>
      <div class="pitfall-card"><h3 data-i18n="zeroTitle"></h3><div id="zero-output"></div></div>
      <div class="pitfall-card"><h3 data-i18n="shortTitle"></h3><div id="short-output"></div></div>
    </section>
  </main>
  <footer><a href="https://github.com/ipusiron/shamir-sharing-cipherlab" data-i18n="source"></a></footer>
  <div id="grid-coordinate-tooltip" class="grid-coordinate-tooltip" hidden aria-hidden="true"></div>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <div class="help-header"><h2 id="help-title" data-i18n="help"></h2><button id="close-help" type="button" data-i18n="close"></button></div>
    <div class="help-body">
    <p data-i18n="helpText"></p>
    <h3 data-i18n="helpHow"></h3>
    <ol class="help-list">
      <li data-i18n="helpStep0"></li><li data-i18n="helpStep1"></li><li data-i18n="helpStep2"></li><li data-i18n="helpStep3"></li>
      <li data-i18n="helpStep4"></li><li data-i18n="helpStep5"></li><li data-i18n="helpStep6"></li>
    </ol>
    <h3 data-i18n="helpUses"></h3>
    <ul class="help-list">
      <li data-i18n="helpUse1"></li><li data-i18n="helpUse2"></li><li data-i18n="helpUse3"></li>
      <li data-i18n="helpUse4"></li><li data-i18n="helpUse5"></li><li data-i18n="helpUse6"></li>
    </ul>
    <h3 data-i18n="helpPrivacy"></h3><p data-i18n="educational"></p><p data-i18n="privacy"></p>
    <details id="help-theory"><summary data-i18n="theory"></summary><p data-i18n="theoryIntro"></p><div id="lessons"></div></details>
    </div>
  </dialog>
</body>
</html>
